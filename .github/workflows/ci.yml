name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARWATCH_DATA_DIR: ${{ github.workspace }}/runtime/ci-tests
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-report=term-missing -m 'not integration'
      - run: python scripts/check_repository.py
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock.txt --no-deps --disable-pip
