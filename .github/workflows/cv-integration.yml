name: Opt-in CV integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pose-video-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARWATCH_DATA_DIR: ${{ github.workspace }}/runtime/ci-integration
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify pretrained detector and clip workflow
        run: python scripts/verify_flow.py
      - name: Verify blank video path
        run: python smoke_video.py
