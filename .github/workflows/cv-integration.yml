name: Opt-in CV integration
on:
  workflow_dispatch:
    inputs:
      public_probe:
        description: Also download and measure the 182 MB licensed MEVA development fixture
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  pose-video-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARWATCH_DATA_DIR: ${{ github.workspace }}/runtime/ci-integration
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install media runtime
        timeout-minutes: 5
        run: bash scripts/install_ci_media.sh
      - name: Install PyTorch CPU builds
        run: python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.txt
      - run: python -m pip install -r requirements-dev.txt -c requirements-cpu.txt
      - run: python -m pip check
      - name: Verify CPU runtime
        run: python -c 'import torch; assert torch.version.cuda is None; print(torch.__version__)'
      - name: Verify pretrained detector and clip workflow
        run: python scripts/verify_flow.py
      - name: Verify blank video path
        run: python smoke_video.py
      - name: Verify notification transport with a local HTTPS receiver
        run: python scripts/verify_alerts.py
      - name: Measure public MEVA development fixture
        if: inputs.public_probe
        run: |
          python scripts/probe_meva.py --download
          python scripts/probe_meva.py --focused
          python scripts/probe_meva.py --focused --detector yolo11s-pose.pt
