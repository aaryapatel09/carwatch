[project]
name = "carwatch"
version = "0.1.0"
description = "Local research tools for reviewing activity around parked vehicles"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires public pretrained weights and ffmpeg"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["runtime", ".venv", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["config", "engine", "features", "store", "temporal", "media", "vision", "live"]

[tool.coverage.report]
show_missing = true
